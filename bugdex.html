<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Litter Bug / bugdex</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0d100c; color: #e8dcc8;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; }
  header { padding: 12px 14px 8px; border-bottom: 1px solid #1c1f1a; position: sticky; top: 0;
    background: #0d100c; z-index: 5; }
  .top { display: flex; align-items: baseline; gap: 10px; }
  h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: .02em; }
  .count { font-size: 12px; color: #8a9178; font-family: ui-monospace, Menlo, monospace; }
  .filters { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; align-items: center; padding-bottom: 2px; }
  .fchip { flex: 0 0 auto; font-size: 12px; min-height: 36px; padding: 0 14px; border-radius: 20px;
    border: 1px solid #2a2f28; background: #15191a; color: #cdbfa6; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; -webkit-tap-highlight-color: transparent; }
  .fchip.on { background: #2a3a1f; border-color: #7ab356; color: #d8ecc4; }
  .fchip.type { color: #0d100c; font-weight: 700; }
  select { margin-left: auto; background: #15191a; color: #e8dcc8; border: 1px solid #2a2f28;
    border-radius: 8px; padding: 5px 8px; font-size: 12px; }

  main { padding: 12px 14px 40px; }
  .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .card { background: #131614; border: 1px solid #1f231d; border-radius: 12px; padding: 8px;
    cursor: pointer; position: relative; }
  .card svg { width: 100%; height: auto; display: block; }
  .card .nm { font-size: 12px; font-weight: 600; color: #c8a84b; margin-top: 4px; line-height: 1.2; }
  .card .row { display: flex; align-items: center; gap: 5px; margin-top: 3px; flex-wrap: wrap; }
  .tbadge { font-size: 9.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
    padding: 1px 6px; border-radius: 5px; color: #0d100c; }
  .lv { font-size: 10px; color: #8a9178; font-family: ui-monospace, Menlo, monospace; }
  .rar { font-size: 10px; font-weight: 600; }
  .dep { position: absolute; top: 6px; right: 8px; font-size: 9px; color: #c8a84b; }
  .empty { text-align: center; color: #8a9178; padding: 40px 20px; font-size: 14px; }
  .statstrip { display: flex; gap: 14px; padding: 8px 0 2px; font-size: 11px; color: #8a9178;
    font-family: ui-monospace, Menlo, monospace; flex-wrap: wrap; }
  .statstrip b { color: #c8a84b; }

  .modal { position: fixed; inset: 0; background: rgba(6,8,6,.75); display: none; align-items: center;
    justify-content: center; padding: 16px; z-index: 20; }
  .modal.show { display: flex; }
  .card2 { background: #131614; border: 1px solid #2a2f28; border-radius: 16px; padding: 16px; max-width: 380px;
    width: 100%; max-height: 88vh; overflow-y: auto; text-align: center; }
  .card2 svg { width: 170px; height: 170px; }
  .card2 .nm { font-size: 19px; font-weight: 600; color: #c8a84b; }
  .card2 .sp { font-style: italic; font-size: 13px; color: #8a9178; }
  .card2 .dg { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: #6f7766; letter-spacing: .04em; }
  .card2 .lore { white-space: pre-line; font-style: italic; font-size: 13px; line-height: 1.55; color: #cdbfa6;
    max-width: 30ch; margin: 8px auto; }
  .card2 .fmatch { font-size: 11px; color: #9aa48c; line-height: 1.45; margin: 6px auto; max-width: 32ch; }
  .card2 .fmatch b { color: #cdbfa6; } .card2 .fmatch .up { color: #7ab356; } .card2 .fmatch .down { color: #c86a4b; }
  .card2 .msetlbl { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #8a9178; margin: 12px 0 5px; text-align: left; }
  .card2 .mset { text-align: left; display: flex; flex-direction: column; gap: 5px; }
  .card2 .mv { background: #10140f; border: 1px solid #1f231d; border-radius: 8px; padding: 6px 9px; }
  .card2 .mv .mvn { font-size: 12.5px; color: #e8dcc8; font-weight: 600; }
  .card2 .mv .mvd { font-size: 10.5px; color: #9aa48c; margin-top: 2px; }
  .card2 .meta { font-size: 12px; color: #cdbfa6; margin: 6px 0; }
  .statrow { display: grid; grid-template-columns: 32px 1fr 30px; align-items: center; gap: 8px; margin: 3px 0;
    font-size: 11px; font-family: ui-monospace, Menlo, monospace; }
  .statrow .lbl { color: #8a9178; text-align: left; } .statrow .val { color: #cdbfa6; text-align: right; }
  .track { height: 7px; background: #1c211a; border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; border-radius: 4px; }
  .card2 .growrow { display: flex; align-items: center; gap: 10px; margin: 12px 2px 2px; }
  .card2 .growrow .glbl { font-size: 10.5px; color: #8a9178; text-transform: uppercase; letter-spacing: .07em; }
  .card2 .growrow .gval { font-size: 12px; color: #c8a84b; min-width: 62px; text-align: right;
    font-family: ui-monospace, Menlo, monospace; }
  .card2 input[type=range] { flex: 1; -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; height: 26px; }
  .card2 input[type=range]::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: #2a3325; }
  .card2 input[type=range]::-moz-range-track { height: 5px; border-radius: 3px; background: #2a3325; }
  .card2 input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px;
    margin-top: -8.5px; border-radius: 50%; background: #c8a84b; border: 2px solid #15191a; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .card2 input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #c8a84b;
    border: 2px solid #15191a; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .card2 button { width: 100%; padding: 12px; background: #15191a; color: #e8dcc8; border: 1px solid #2a2f28;
    border-radius: 10px; font-size: 15px; cursor: pointer; margin-top: 10px; }
</style>
</head>
<body>
<script>
/* Sky Wolf portal embed: announce alive on every page, so the arcade's
   black-screen recovery never mistakes an in-game navigation for a dead
   frame (it yanked players back to the arcade mid-trial, Stephen 7/30). */
if (window.parent !== window) {
  var swsHi = function () { try { parent.postMessage({ sws: 'ready' }, '*'); } catch (e) {} };
  swsHi(); window.addEventListener('load', swsHi); setTimeout(swsHi, 700);
}
</script>

<header>
  <div class="top"><h1>Litter Bug / bugdex</h1><span class="count" id="count"></span></div>
  <div class="filters" id="filters"></div>
  <div class="statstrip" id="statstrip"></div>
</header>
<main><div class="grid" id="grid"></div><div class="empty" id="empty" style="display:none">
  No bugs yet. Roll some in the Mint Lab and they will appear here.</div></main>
<div class="modal" id="modal"><div class="card2" id="detail"></div></div>

<script src="bug-engine.js"></script>
<script src="battle-engine.js"></script>
<script src="world-engine.js"></script>
<script>
(function () {
  'use strict';
  var E = window.BUG_ENGINE, W = window.WORLD_ENGINE, BAT = window.BATTLE_ENGINE;
  var TYPE_COLOR = { Rust:'#b06a3a', Moss:'#5a9a52', Spark:'#d99a2f', Ooze:'#8a6fb0', Glass:'#6fa8c4', Ash:'#7a7a74' };
  var RARITY_COLOR = { Common:'#8a9178', Uncommon:'#7ab356', Rare:'#4a9ad4', Epic:'#b06fd4', Legendary:'#e0a13c' };
  var RARITY_ORDER = { Common:0, Uncommon:1, Rare:2, Epic:3, Legendary:4 };
  var STAT_ORDER = [['HP','hp'],['ATK','atk'],['DEF','def'],['SPD','spd'],['ACC','acc'],['EVA','eva']];

  var vault = W.browserLoad();
  var deployed = W.deployedMap(vault);
  var typeFilter = 'All', sortBy = 'power';

  function entries() {
    var list = vault.bugs.map(function (bg) {
      var st = E.bugStats(bg.cb), id = E.bugIdentity(bg.cb);
      return { bg: bg, st: st, id: id };
    });
    if (typeFilter !== 'All') list = list.filter(function (e) { return e.st.type === typeFilter; });
    list.sort(function (a, b) {
      if (sortBy === 'power') return b.st.power - a.st.power;
      if (sortBy === 'level') return b.bg.level - a.bg.level;
      if (sortBy === 'rarity') return RARITY_ORDER[b.st.rarity] - RARITY_ORDER[a.st.rarity];
      return a.id.name.localeCompare(b.id.name);
    });
    return list;
  }

  function renderFilters() {
    var f = document.getElementById('filters');
    var types = ['All'].concat(E.TYPES);
    f.innerHTML = types.map(function (t) {
      var on = typeFilter === t;
      var style = (t !== 'All') ? ' style="background:' + (on ? TYPE_COLOR[t] : '#15191a') + ';' + (on ? 'color:#0d100c' : 'color:' + TYPE_COLOR[t]) + '"' : '';
      return '<span class="fchip' + (on ? ' on' : '') + (t !== 'All' ? ' type' : '') + '" data-t="' + t + '"' + style + '>' + t + '</span>';
    }).join('') + '<select id="sort">'
      + ['power', 'level', 'rarity', 'name'].map(function (s) { return '<option value="' + s + '"' + (s === sortBy ? ' selected' : '') + '>sort: ' + s + '</option>'; }).join('')
      + '</select>';
    Array.prototype.forEach.call(f.querySelectorAll('.fchip'), function (el) {
      el.addEventListener('click', function () { typeFilter = el.getAttribute('data-t'); render(); });
    });
    document.getElementById('sort').addEventListener('change', function () { sortBy = this.value; render(); });
  }

  function render() {
    renderFilters();
    var list = entries();
    document.getElementById('count').textContent = vault.bugs.length + ' collected'
      + (typeFilter !== 'All' ? ' · ' + list.length + ' ' + typeFilter : '');
    var strip = document.getElementById('statstrip');
    if (vault.bugs.length) {
      var owned = {}, topLvl = 0, totalPwr = 0;
      vault.bugs.forEach(function (b) {
        var st = E.bugStats(b.cb);
        owned[st.type] = 1; if (st.type2) owned[st.type2] = 1;
        topLvl = Math.max(topLvl, b.level); totalPwr += st.power;
      });
      strip.innerHTML = '<span><b>' + Object.keys(owned).length + '</b>/' + E.TYPES.length + ' types</span>'
        + '<span>top <b>L' + topLvl + '</b></span>'
        + '<span><b>' + totalPwr + '</b> total power</span>';
    } else strip.innerHTML = '';
    var grid = document.getElementById('grid');
    document.getElementById('empty').style.display = vault.bugs.length ? 'none' : 'block';
    grid.innerHTML = list.map(function (e) {
      var tcol = TYPE_COLOR[e.st.type];
      return '<div class="card" data-cb="' + e.bg.cb + '">'
        + (deployed[e.bg.cb] ? '<span class="dep">deployed</span>' : '')
        + E._generateBugSVG(e.bg.cb, 130, e.bg.level)
        + '<div class="nm">' + e.id.name + '</div>'
        + '<div class="row"><span class="tbadge" style="background:' + tcol + '">' + e.st.type + '</span>'
        + (e.st.type2 ? '<span class="tbadge" style="background:' + (TYPE_COLOR[e.st.type2] || '#8a9178') + '">' + e.st.type2 + '</span>' : '')
        + '<span class="rar" style="color:' + RARITY_COLOR[e.st.rarity] + '">' + e.st.rarity + '</span>'
        + '<span class="lv">L' + e.bg.level + '</span></div></div>';
    }).join('');
    Array.prototype.forEach.call(grid.querySelectorAll('.card'), function (el) {
      el.addEventListener('click', function () { openDetail(el.getAttribute('data-cb')); });
    });
  }

  function movesetHTML(code) {
    if (!BAT || !BAT.buildFighter) return '';
    var f = BAT.buildFighter(code, 1);
    var rows = f.moves.map(function (m) {
      var tb = m.kind === 'attack' ? '<span class="tbadge" style="background:' + (TYPE_COLOR[m.type] || '#8a9178') + '">' + m.type + '</span> ' : '';
      var stat = m.kind === 'attack' ? ((m.multi > 1 ? m.multi + ' hits' : 'attack') + (m.stab ? ' &middot; STAB' : '')) : 'status';
      return '<div class="mv"><div class="mvn">' + m.name + (m.stab && m.kind === 'attack' ? ' <span style="color:#c8a84b">&#10022;</span>' : '') + '</div>'
        + '<div class="mvd">' + tb + stat + (m.desc ? ' &middot; ' + m.desc : '') + '</div></div>';
    }).join('');
    return '<div class="msetlbl">Moveset</div><div class="mset">' + rows + '</div>';
  }
  function matchLine(type) {
    var strong = [], weak = [];
    E.TYPES.forEach(function (d) { var m = E.typeMatchup(type, d); if (m > 1) strong.push(d); else if (m < 1) weak.push(d); });
    return '<div class="fmatch"><b>' + type + '</b> hits are <span class="up">strong vs ' + strong.join(', ')
      + '</span>, <span class="down">weak vs ' + weak.join(', ') + '</span></div>';
  }
  function openDetail(cb) {
    var bg = W.findBug(vault, cb), st = E.bugStats(cb), id = E.bugIdentity(cb);
    var actual = bg ? bg.level : 1, tcol = TYPE_COLOR[st.type];
    function barsHTML(level) {
      var ls = W.leveledStats(cb, level);
      return STAT_ORDER.map(function (o) {
        var v = ls[o[1]], w = Math.min(100, Math.round(v / 160 * 100));
        return '<div class="statrow"><span class="lbl">' + o[0] + '</span><span class="track">'
          + '<span class="fill" style="width:' + w + '%;background:' + tcol + '"></span></span><span class="val">' + v + '</span></div>';
      }).join('');
    }
    function glabel(n) { return n === actual ? 'L' + n + ' now' : 'L' + n; }
    document.getElementById('detail').innerHTML =
      '<div id="detailArt">' + E._generateBugSVG(cb, 170, actual) + '</div>'
      + '<div class="nm">' + id.name + '</div><div class="sp">' + id.species + '</div>'
      + '<div class="dg">' + id.designation + '</div>'
      + '<div class="meta"><span class="tbadge" style="background:' + tcol + '">' + st.type + '</span>'
      + (st.type2 ? ' <span class="tbadge" style="background:' + (TYPE_COLOR[st.type2] || '#8a9178') + '">' + st.type2 + '</span>' : '') + ' '
      + st.cls + ' · <span style="color:' + RARITY_COLOR[st.rarity] + '">' + st.rarity + '</span> · Lv ' + actual
      + (bg ? ' · ' + bg.wins + ' wins' : '') + '</div>'
      + '<div class="meta" style="color:#8a9178;font-size:11px">' + st.kit + '</div>'
      + '<div class="growrow"><span class="glbl">grow</span>'
      + '<input type="range" id="grow" min="1" max="30" value="' + actual + '" aria-label="preview growth level">'
      + '<span class="gval" id="gval">' + glabel(actual) + '</span></div>'
      + '<div id="detailBars" style="text-align:left;margin:8px 0">' + barsHTML(actual) + '</div>'
      + matchLine(st.type)
      + movesetHTML(cb)
      + '<div class="lore">' + id.lore + '</div>'
      + '<button id="close">Close</button>';
    document.getElementById('modal').classList.add('show');
    var slider = document.getElementById('grow');
    slider.addEventListener('input', function () {
      var n = +slider.value;
      document.getElementById('detailArt').innerHTML = E._generateBugSVG(cb, 170, n);
      document.getElementById('detailBars').innerHTML = barsHTML(n);
      document.getElementById('gval').textContent = glabel(n);
    });
    document.getElementById('close').addEventListener('click', hide);
  }
  function hide() { document.getElementById('modal').classList.remove('show'); }
  document.getElementById('modal').addEventListener('click', function (e) { if (e.target === this) hide(); });

  render();
})();
</script>
</body>
</html>
