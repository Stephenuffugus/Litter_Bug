<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Litter Bug / world</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d100c; color: #e8dcc8;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; overflow: hidden; }
  body { display: flex; flex-direction: column; }

  header { padding: 8px 12px; border-bottom: 1px solid #1c1f1a; display: flex;
    align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  .hud { display: flex; gap: 12px; margin-left: auto; font-family: ui-monospace, Menlo, monospace;
    font-size: 12px; }
  .hud b { color: #c8a84b; }
  .hud .en { color: #7ab356; }

  .viewport { flex: 1; position: relative; overflow: hidden; touch-action: none;
    background:
      radial-gradient(circle at 30% 20%, #15191a 0, #0d100c 60%),
      repeating-linear-gradient(0deg, #10130e 0 1px, transparent 1px 46px),
      repeating-linear-gradient(90deg, #10130e 0 1px, transparent 1px 46px);
    cursor: grab; }
  .viewport.drag { cursor: grabbing; }
  .world { position: absolute; left: 50%; top: 50%; will-change: transform; }
  .cell { position: absolute; width: 84px; height: 84px; margin: -42px 0 0 -42px;
    border-radius: 14px; border: 2px solid #23271f; background: #12150f;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: border-color .1s; }
  .cell.empty { border-style: dashed; border-color: #22271d; }
  .cell.empty.canplace { border-color: #3a4634; background: #141a10; }
  .cell.empty .plus { color: #3a4634; font-size: 26px; }
  .cell.wild { border-color: #7a4a3a; }
  .cell.yours { border-color: #c8a84b; background: #161509; }
  .cell.rival { background: #1a1210; }
  .cell .rivtag { position: absolute; bottom: 2px; left: 0; right: 0; font-size: 7.5px;
    color: #e0907a; text-align: center; }
  .log .held { color: #7ab356; } .log .lostc { color: #c86a4b; }
  .cell.home::after { content: "home"; position: absolute; bottom: 3px; font-size: 8px;
    letter-spacing: .1em; color: #c8a84b; text-transform: uppercase; }
  .cell svg { width: 64px; height: 64px; }
  .cell .lv { position: absolute; top: 2px; right: 4px; font-size: 9.5px; font-weight: 700;
    font-family: ui-monospace, Menlo, monospace; color: #e8dcc8;
    background: rgba(0,0,0,.5); border-radius: 5px; padding: 0 4px; }
  .cell.wild .lv { color: #f0b49a; }
  .cell.yours .lv { color: #f0dca0; }

  .roster { border-top: 1px solid #1c1f1a; padding: 8px 10px; display: flex; gap: 8px;
    overflow-x: auto; align-items: center; background: #0f120d; }
  .chip { flex: 0 0 auto; width: 58px; text-align: center; padding: 4px 2px; border-radius: 10px;
    border: 2px solid transparent; cursor: pointer; position: relative; }
  .chip.sel { border-color: #7ab356; background: #141a10; }
  .chip svg { width: 46px; height: 46px; }
  .chip .cl { font-size: 9px; color: #8a9178; font-family: ui-monospace, Menlo, monospace; }
  .chip .dep { position: absolute; top: 2px; right: 6px; width: 8px; height: 8px; border-radius: 50%;
    background: #c8a84b; }
  .rbtn { flex: 0 0 auto; padding: 8px 10px; background: #1d251c; color: #d8ecc4;
    border: 1px solid #3a4634; border-radius: 10px; font-size: 12px; cursor: pointer; min-height: 44px; }

  .toast { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
    background: #1c211a; border: 1px solid #3a4634; border-radius: 10px; padding: 8px 14px;
    font-size: 13px; color: #e8dcc8; opacity: 0; transition: opacity .2s; pointer-events: none;
    max-width: 90%; text-align: center; }
  .toast.show { opacity: 1; }

  .modal { position: fixed; inset: 0; background: rgba(6,8,6,.72); display: none;
    align-items: center; justify-content: center; padding: 16px; z-index: 20; }
  .modal.show { display: flex; }
  .card { background: #131614; border: 1px solid #2a2f28; border-radius: 16px; padding: 16px;
    max-width: 400px; width: 100%; max-height: 86vh; overflow-y: auto; }
  .card h2 { margin: 0 0 4px; font-size: 18px; }
  .card h2.win { color: #7ab356; } .card h2.lose { color: #c86a4b; } .card h2.draw { color: #cdbfa6; }
  .card .fight { display: flex; align-items: center; justify-content: space-around; gap: 8px; margin: 6px 0; }
  .card .fight svg { width: 84px; height: 84px; }
  .card .fight .foe svg { transform: scaleX(-1); }
  .card .sub { font-size: 12px; color: #8a9178; text-align: center; }
  .card .xp { text-align: center; color: #c8a84b; font-size: 13px; margin: 6px 0; }
  .card .lvup { color: #7ab356; font-weight: 600; }
  .card .log { background: #10140f; border: 1px solid #1f231d; border-radius: 8px; padding: 8px 10px;
    max-height: 160px; overflow-y: auto; font-size: 12px; line-height: 1.5; color: #cdbfa6; margin: 8px 0; }
  .card .log .ko { color: #e0a13c; } .card .log .se { color: #7ab356; }
  .card button { width: 100%; padding: 12px; background: #2a3a1f; color: #d8ecc4;
    border: 1px solid #7ab356; border-radius: 10px; font-size: 15px; cursor: pointer; min-height: 48px; }
  .card button.ghost { background: #15191a; border-color: #2a2f28; color: #e8dcc8; margin-top: 8px; }
  .bgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0; }
  .bchip { text-align: center; padding: 4px; border-radius: 10px; border: 2px solid transparent;
    cursor: pointer; background: #10140f; }
  .bchip.sel { border-color: #7ab356; background: #141a10; }
  .bchip svg { width: 44px; height: 44px; }
  .bchip .cl { font-size: 9px; color: #8a9178; font-family: ui-monospace, Menlo, monospace; }
  .bpreview { text-align: center; background: #10140f; border: 1px solid #23281f; border-radius: 12px;
    padding: 8px; margin: 8px 0; }
  .bpreview svg { width: 88px; height: 88px; }
  .bpreview .pvlabel { font-size: 9.5px; color: #8a9178; text-transform: uppercase; letter-spacing: .07em; }
  .bpreview .pvname { font-size: 14px; color: #c8a84b; font-weight: 600; margin-top: 2px; }
  .bpreview .pvmeta { font-size: 11px; color: #cdbfa6; margin-top: 3px; }
  .bpreview .pvexists { font-size: 11px; color: #d99a2f; margin-top: 5px; }
  .bfight { display: flex; align-items: flex-start; justify-content: space-around; gap: 6px; }
  .bside { flex: 1; text-align: center; } .bside.foe svg { transform: scaleX(-1); }
  .bside svg { width: 74px; height: 74px; }
  .bside .bn { font-size: 11px; color: #c8a84b; font-weight: 600; line-height: 1.15; min-height: 26px; }
  .bside .lv { color: #8a9178; font-weight: 400; }
  .btrack { height: 8px; background: #1c211a; border-radius: 5px; overflow: hidden; margin-top: 3px; }
  .bfill { height: 100%; border-radius: 5px; transition: width .3s; }
  .bhptext { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: #8a9178; margin-top: 2px; }
  .bvs { align-self: center; color: #6f7766; font-size: 11px; }
  .blog { background: #10140f; border: 1px solid #1f231d; border-radius: 8px; padding: 6px 9px;
    height: 96px; overflow-y: auto; font-size: 11.5px; line-height: 1.5; color: #cdbfa6; margin: 8px 0; }
  .blog .ko { color: #e0a13c; } .blog .se { color: #7ab356; }
  .bmoves { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .bmove { padding: 8px 9px; background: #1d251c; color: #e8dcc8; border: 1px solid #3a4634;
    border-radius: 8px; cursor: pointer; min-height: 48px; text-align: left; }
  .bmove:active { background: #2a3527; }
  .bmove .bm-top { font-size: 12.5px; font-weight: 600; }
  .bmove .bm-sub { font-size: 9.5px; color: #9aa48c; margin-top: 3px; line-height: 1.35; }
  .bmove .pip { color: #c8a84b; } .bmove .g.up { color: #7ab356; } .bmove .g.down { color: #c86a4b; }
  .bmove .pchip { color: #d9a441; } .bmove .yf { color: #7ab356; white-space: nowrap; }
  .bmove .tbadge { font-size: 8.5px; }
  .bpoise { position: relative; height: 3px; background: #1c211a; border-radius: 2px; margin-top: 3px; }
  .bpoise > div { position: absolute; inset: 0; background: #d9a441; border-radius: 2px; transition: width .3s; }
  .bintent { text-align: center; font-size: 10.5px; color: #9aa48c; margin: 0 0 7px; }
  .bintent b { color: #e0b0a0; } .bintent .g.up { color: #7ab356; } .bintent .g.down { color: #c86a4b; }
  .bresult { text-align: center; padding: 9px; border-radius: 8px; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .bresult.win { background: #2a3a1f; color: #d8ecc4; } .bresult.lose { background: #3a201c; color: #f0c4b4; }
  .bresult.draw { background: #23262a; color: #cdbfa6; }
  .bquick { width: 100%; background: #15191a; border: 1px solid #2a2f28; color: #8a9178;
    border-radius: 8px; padding: 8px; font-size: 12px; cursor: pointer; margin-top: 6px; }
  .chip .xps { height: 2px; background: #1c211a; border-radius: 2px; margin-top: 2px; }
  .chip .xpf { height: 100%; background: #7ab356; border-radius: 2px; }
  .grewnote { text-align: center; font-size: 12px; color: #7ab356; margin: -2px 0 8px;
    font-family: ui-monospace, Menlo, monospace; }
  @keyframes growpop { 0% { transform: scale(.86); opacity: .3; } 60% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); } }
  .growpop { animation: growpop .5s ease-out; }
  .tglink { color: #7ab356; cursor: pointer; text-decoration: underline; font-size: 10px; margin-left: 6px; }
  .fmatch { font-size: 11px; color: #9aa48c; line-height: 1.45; margin: 6px 0; }
  .fmatch b { color: #cdbfa6; } .fmatch .up { color: #7ab356; } .fmatch .down { color: #c86a4b; }
  .ob { text-align: left; font-size: 13px; line-height: 1.5; color: #cdbfa6; margin: 6px 0 2px; }
  .ob p { margin: 9px 0; } .ob b { color: #c8a84b; }
  .recenter { position: absolute; right: 12px; bottom: 12px; z-index: 5; background: rgba(21,25,26,.92);
    border: 1px solid #2a2f28; color: #cdbfa6; border-radius: 20px; padding: 8px 14px; font-size: 12px;
    cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .recenter:active { background: #2a3527; }
  .tgmodal { position: fixed; inset: 0; background: rgba(6,8,6,.8); display: none; align-items: center; justify-content: center; z-index: 60; padding: 16px; }
  .tgmodal.show { display: flex; }
  .tgcard { background: #131614; border: 1px solid #2a2f28; border-radius: 16px; padding: 16px 18px; max-width: 340px; width: 100%; max-height: 86vh; overflow-y: auto; }
  .tgcard h2 { margin: 0 0 6px; font-size: 18px; color: #e8dcc8; }
  .tgnote { font-size: 11px; color: #8a9178; margin-bottom: 8px; line-height: 1.45; }
  .tgrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid #1f231d; }
  .tgrow .tgt { min-width: 54px; }
  .tgse { font-size: 11px; color: #cdbfa6; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .tglbl { font-size: 8.5px; text-transform: uppercase; letter-spacing: .06em; }
  .tglbl.up { color: #7ab356; } .tglbl.down { color: #c86a4b; }
  .tgcard .tbadge { font-size: 9px; }
  .tgcard button { width: 100%; margin-top: 12px; padding: 11px; background: #15191a; color: #e8dcc8; border: 1px solid #2a2f28; border-radius: 10px; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
<script>
/* Sky Wolf portal embed: announce alive on every page, so the arcade's
   black-screen recovery never mistakes an in-game navigation for a dead
   frame (it yanked players back to the arcade mid-trial, Stephen 7/30). */
if (window.parent !== window) {
  var swsHi = function () { try { parent.postMessage({ sws: 'ready' }, '*'); } catch (e) {} };
  swsHi(); window.addEventListener('load', swsHi); setTimeout(swsHi, 700);
}
</script>

<header>
  <h1>Litter Bug / world</h1>
  <div class="hud">
    <span>territory <b id="hTerr">0</b></span>
    <span>scrap <b id="hScrap">0</b></span>
    <span class="en">energy <b class="en" id="hEn">0</b>/<span id="hEnMax">10</span></span>
  </div>
</header>
<div class="viewport" id="vp">
  <div class="world" id="world"></div>
  <button class="recenter" id="recenter" style="display:none">&#9678; home</button>
  <div class="toast" id="toast"></div>
</div>
<div class="roster" id="roster"></div>

<div class="modal" id="modal"><div class="card" id="card"></div></div>

<script src="bug-engine.js"></script>
<script src="battle-engine.js"></script>
<script src="world-engine.js"></script>
<script>
(function () {
  'use strict';
  var E = window.BUG_ENGINE, W = window.WORLD_ENGINE, BAT = window.BATTLE_ENGINE;
  var TYPE_COLOR = { Rust:'#b06a3a', Moss:'#5a9a52', Spark:'#d99a2f', Ooze:'#8a6fb0', Glass:'#6fa8c4', Ash:'#7a7a74' };
  var CELL = 96, R = 4, SAVE = 'litterbug_vault_v1';

  function now() { return Date.now(); }
  function randomCB() {
    var b = new Uint8Array(32); (window.crypto || window.msCrypto).getRandomValues(b);
    var s = ''; for (var i = 0; i < b.length; i++) s += ('0' + b[i].toString(16)).slice(-2); return s;
  }
  function load() { return W.browserLoad(); }   // shared with mint-lab
  function save(v) { W.browserSave(v); }

  var vault = load();
  var center = { ix: 0, iy: 0 };
  var activeCb = (vault.bugs[0] || {}).cb;

  var worldEl = document.getElementById('world');
  var vp = document.getElementById('vp');

  function bugType(cb) { return E.bugStats(cb).type; }

  function renderHUD() {
    if (W.collectScrap(vault, now()) > 0) save(vault);   // auto-bank territory income
    document.getElementById('hTerr').textContent = W.summary(vault).territory;
    document.getElementById('hScrap').textContent = vault.scrap || 0;
    document.getElementById('hEn').textContent = W.energyNow(vault, now());
    document.getElementById('hEnMax').textContent = vault.energyMax;
  }

  function renderRoster() {
    var dep = W.deployedMap(vault);
    var r = document.getElementById('roster');
    r.innerHTML = '';
    vault.bugs.forEach(function (bg) {
      var st = E.bugStats(bg.cb);
      var chip = document.createElement('div');
      chip.className = 'chip' + (bg.cb === activeCb ? ' sel' : '');
      chip.innerHTML = E._generateBugSVG(bg.cb, 46, bg.level)
        + '<div class="cl">L' + bg.level + ' ' + st.type + '</div>'
        + (bg.level < W.LEVEL_CAP ? '<div class="xps"><div class="xpf" style="width:' + Math.min(100, Math.round((bg.xp || 0) / W.xpToNext(bg.level) * 100)) + '%"></div></div>' : '')
        + (dep[bg.cb] ? '<div class="dep" title="deployed"></div>' : '');
      chip.addEventListener('click', function () { activeCb = bg.cb; renderRoster(); renderMap(); });
      r.appendChild(chip);
    });
    var mint = document.createElement('button');
    mint.className = 'rbtn'; mint.textContent = '+ new bug';
    mint.addEventListener('click', function () {
      var cb = randomCB(); W.addBug(vault, cb); activeCb = cb; save(vault);
      renderRoster(); renderMap(); toast('Rolled a new bug into your roster.');
    });
    r.appendChild(mint);
    var breedBtn = document.createElement('button');
    breedBtn.className = 'rbtn'; breedBtn.textContent = 'breed';
    breedBtn.addEventListener('click', openBreed);
    r.appendChild(breedBtn);
  }

  // ── breeding ─────────────────────────────────────────────────────
  var breedSel = [];
  function openBreed() { breedSel = []; renderBreed(); showModal(); }
  function renderBreed() {
    var chips = vault.bugs.map(function (bg) {
      var st = E.bugStats(bg.cb), sel = breedSel.indexOf(bg.cb) >= 0;
      return '<div class="bchip' + (sel ? ' sel' : '') + '" data-cb="' + bg.cb + '">'
        + E._generateBugSVG(bg.cb, 44, bg.level) + '<div class="cl">L' + bg.level + ' ' + st.type + '</div></div>';
    }).join('');
    var preview = '', childExists = false;
    if (breedSel.length === 2) {
      var childCb = E.breed(breedSel[0], breedSel[1]);
      childExists = !!W.findBug(vault, childCb);
      var cs = E.bugStats(childCb), cn = E.bugName(childCb);
      var t2 = cs.type2 ? ' <span class="tbadge" style="background:' + (TYPE_COLOR[cs.type2] || '#8a9178') + '">' + cs.type2 + '</span>' : '';
      preview = '<div class="bpreview"><div class="pvlabel">this pairing makes</div>'
        + E._generateBugSVG(childCb, 88, 1)
        + '<div class="pvname">' + cn + '</div>'
        + '<div class="pvmeta"><span class="tbadge" style="background:' + (TYPE_COLOR[cs.type] || '#8a9178') + '">' + cs.type + '</span>' + t2
        + ' &middot; ' + cs.cls + ' &middot; ' + cs.rarity + '</div>'
        + (childExists ? '<div class="pvexists">You already have this one. Try a different pairing.</div>' : '')
        + '</div>';
    }
    var canBreed = breedSel.length === 2 && !childExists;
    var card = document.getElementById('card');
    card.innerHTML = '<h2>Breed</h2>'
      + '<div class="sub">Pick two parents. The child inherits their traits. '
      + 'Costs ' + W.BREED_COST + ' scrap, you have ' + (vault.scrap || 0) + '.</div>'
      + '<div class="bgrid">' + chips + '</div>'
      + preview
      + '<button id="mBreed"' + (canBreed ? '' : ' disabled') + '>' + (breedSel.length === 2 ? 'Breed this bug' : 'Breed') + '</button>'
      + '<button class="ghost" id="mClose">Close</button>';
    Array.prototype.forEach.call(card.querySelectorAll('.bchip'), function (el) {
      el.addEventListener('click', function () {
        var cb = el.getAttribute('data-cb'), idx = breedSel.indexOf(cb);
        if (idx >= 0) breedSel.splice(idx, 1);
        else { if (breedSel.length >= 2) breedSel.shift(); breedSel.push(cb); }
        renderBreed();
      });
    });
    var bb = document.getElementById('mBreed');
    if (bb) bb.addEventListener('click', function () {
      var r = W.breedBugs(vault, breedSel[0], breedSel[1], now());
      if (!r.ok) { toast(r.reason); return; }
      activeCb = r.childCb; save(vault); renderRoster(); renderMap(); hideModal();
      toast('Bred a new bug into your roster.');
    });
    var c = document.getElementById('mClose'); if (c) c.addEventListener('click', hideModal);
  }

  function cellEl(ix, iy) {
    var st = W.cellState(vault, ix, iy);
    var el = document.createElement('div');
    el.className = 'cell ' + st.type + (ix === 0 && iy === 0 ? ' home' : '');
    el.style.left = ((ix - center.ix) * CELL) + 'px';
    el.style.top = ((iy - center.iy) * CELL) + 'px';
    var activeReserve = activeCb && !W.deployedMap(vault)[activeCb];
    if (st.type === 'empty') {
      if (activeReserve) el.className += ' canplace';
      el.innerHTML = '<span class="plus">' + (activeReserve ? '+' : '') + '</span>';
    } else {
      var tcol = TYPE_COLOR[bugType(st.cb)] || '#8a9178';
      el.style.borderColor = (st.type === 'rival') ? '#c0604a' : tcol;
      el.innerHTML = E._generateBugSVG(st.cb, 64, st.level) + '<span class="lv">L' + st.level + '</span>'
        + (st.type === 'rival' ? '<span class="rivtag">' + (st.owner || 'rival') + '</span>' : '');
    }
    el.addEventListener('click', function (e) { if (!dragging) onCell(ix, iy, st); });
    return el;
  }

  function renderMap() {
    worldEl.innerHTML = '';
    for (var dx = -R; dx <= R; dx++)
      for (var dy = -R; dy <= R; dy++)
        worldEl.appendChild(cellEl(center.ix + dx, center.iy + dy));
    worldEl.style.transform = 'translate(' + panX + 'px,' + panY + 'px)';
    var rc = document.getElementById('recenter');
    if (rc) rc.style.display = (center.ix === 0 && center.iy === 0) ? 'none' : 'block';
    renderHUD();
  }

  // ── pan ──────────────────────────────────────────────────────────
  var panX = 0, panY = 0, dragging = false, startX = 0, startY = 0, moved = 0;
  document.getElementById('recenter').addEventListener('click', function () {
    center.ix = 0; center.iy = 0; panX = 0; panY = 0; renderMap();
  });
  vp.addEventListener('pointerdown', function (e) {
    dragging = false; moved = 0; startX = e.clientX; startY = e.clientY;
    vp.setPointerCapture(e.pointerId); vp.classList.add('drag');
    vp._down = true;
  });
  vp.addEventListener('pointermove', function (e) {
    if (!vp._down) return;
    panX = e.clientX - startX; panY = e.clientY - startY;
    moved = Math.abs(panX) + Math.abs(panY);
    if (moved > 8) dragging = true;
    worldEl.style.transform = 'translate(' + panX + 'px,' + panY + 'px)';
  });
  function endPan() {
    vp._down = false; vp.classList.remove('drag');
    if (dragging) {
      center.ix -= Math.round(panX / CELL);
      center.iy -= Math.round(panY / CELL);
    }
    panX = 0; panY = 0; renderMap();
    setTimeout(function () { dragging = false; }, 0);
  }
  vp.addEventListener('pointerup', endPan);
  vp.addEventListener('pointercancel', endPan);

  // ── interaction ──────────────────────────────────────────────────
  var toastT;
  function toast(msg) {
    var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }
  function onCell(ix, iy, st) {
    if (st.type === 'empty') {
      if (!activeCb) return toast('Pick a bug from your roster first.');
      if (W.deployedMap(vault)[activeCb]) return toast('That bug is deployed. Pick a reserve bug.');
      var r = W.placeBug(vault, ix, iy, activeCb, now());
      if (!r.ok) return toast(r.reason);
      save(vault); renderRoster(); renderMap(); toast('Claimed the cell.');
    } else if (st.type === 'wild' || st.type === 'rival') {
      if (!activeCb) return toast('Pick a bug to attack with.');
      openAttack(ix, iy, st);
    } else { openInfo(ix, iy, st); }
  }

  function logLines(log) {
    return log.map(function (l) {
      var c = /is down|succumbs|draw/i.test(l) ? ' class="ko"' : /Super effective/.test(l) ? ' class="se"' : '';
      return '<div' + c + '>' + l + '</div>';
    }).join('');
  }
  // Interactive territory battle: play the fight move by move against the
  // cell's frozen defender, then claim on a win.
  function openAttack(ix, iy, cell) {
    var beg = W.beginAttack(vault, ix, iy, activeCb, now());
    if (!beg.ok) { toast(beg.reason); return; }
    save(vault); renderRoster(); renderMap();      // energy spent up front
    var st = BAT.startBattle(activeCb, beg.defenderCb, beg.attackerLevel, beg.defenderLevel);
    st._fulllog = ['Your ' + st.a.name + ' challenges ' + st.b.name + ' for the cell.'];
    renderBattle(ix, iy, beg, st);
    showModal();
  }
  function applyBattle(ix, iy, beg, won) {
    var r = W.applyAttackResult(vault, ix, iy, activeCb, won, beg.defenderLevel, now());
    save(vault); renderRoster(); renderMap();
    return r;
  }
  function advance(st, idx) { BAT.playerRound(st, idx); st._fulllog = st._fulllog.concat(st.log); }
  function bestMove(self, foe) {
    var best = 0, bs = -1;
    self.moves.forEach(function (m, i) {
      var s = m.kind === 'attack' ? m.pow * (m.multi || 1) * E.typeMatchupDual(m.type, foe.type, foe.type2) * (m.stab ? 1.4 : 1) : 0.5;
      if (s > bs) { bs = s; best = i; }
    });
    return best;
  }
  function effWord(m) { if (m > 2) return { g: '&#9650;&#9650;', c: 'up' }; if (m > 1.05) return { g: '&#9650;', c: 'up' }; if (m < 0.5) return { g: '&#9660;&#9660;', c: 'down' }; if (m < 0.95) return { g: '&#9660;', c: 'down' }; return { g: '', c: '' }; }
  function matchLine(type) {
    var strong = [], weak = [];
    E.TYPES.forEach(function (d) { var m = E.typeMatchup(type, d); if (m > 1) strong.push(d); else if (m < 1) weak.push(d); });
    return '<div class="fmatch"><b>' + type + '</b> hits are <span class="up">strong vs ' + strong.join(', ')
      + '</span>, <span class="down">weak vs ' + weak.join(', ') + '</span></div>';
  }
  function typeGuideHTML() {
    function badge(t) { return '<span class="tbadge" style="background:' + (TYPE_COLOR[t] || '#8a9178') + '">' + t + '</span>'; }
    var rows = E.TYPES.map(function (a) {
      var strong = [], weak = [];
      E.TYPES.forEach(function (dd) { var m = E.typeMatchup(a, dd); if (m > 1) strong.push(dd); else if (m < 1) weak.push(dd); });
      return '<div class="tgrow"><div class="tgt">' + badge(a) + '</div>'
        + '<div class="tgse"><span class="tglbl up">strong</span> ' + strong.map(badge).join(' ') + '</div>'
        + '<div class="tgse"><span class="tglbl down">weak</span> ' + weak.map(badge).join(' ') + '</div></div>';
    }).join('');
    return '<h2>Type guide</h2><div class="tgnote">Hitting a type it is weak to is super effective: more damage, and it chips the foe’s guard. A dual-type foe multiplies both of its matchups.</div>' + rows + '<button id="tgClose">Close</button>';
  }
  function openTypeGuide() {
    var tgm = document.getElementById('tgmodal');
    document.getElementById('tgcard').innerHTML = typeGuideHTML();
    tgm.classList.add('show');
    document.getElementById('tgClose').onclick = function () { tgm.classList.remove('show'); };
    tgm.onclick = function (e) { if (e.target === tgm) tgm.classList.remove('show'); };
  }
  function bpanel(f, foe) {
    var tc = TYPE_COLOR[f.type] || '#8a9178';
    var pct = Math.max(0, Math.round(f.hp / f.maxhp * 100));
    var hpc = pct > 50 ? '#7ab356' : pct > 22 ? '#d99a2f' : '#c86a4b';
    var badges = (f.corrode > 0 ? ' &#9763;' : '') + (f.smolder > 0 ? ' &#9832;' : '') + (f.rustlock ? ' &#9202;' : '');
    var t2 = f.type2 ? '<span class="tbadge" style="background:' + (TYPE_COLOR[f.type2] || '#8a9178') + '">' + f.type2 + '</span>' : '';
    return '<div class="bside' + (foe ? ' foe' : '') + '">' + E._generateBugSVG(f.cb, 74, f.level)
      + '<div class="bn">' + f.name + ' <span class="lv">L' + f.level + '</span></div>'
      + '<div style="font-size:9px"><span class="tbadge" style="background:' + tc + '">' + f.type + '</span>' + t2 + '</div>'
      + '<div class="btrack"><div class="bfill" style="width:' + pct + '%;background:' + hpc + '"></div></div>'
      + '<div class="bhptext">' + f.hp + '/' + f.maxhp + badges + '</div>'
      + (f.poiseMax ? '<div class="bpoise" title="guard ' + f.poise + '/' + f.poiseMax + '"><div style="width:' + Math.round(f.poise / f.poiseMax * 100) + '%"></div></div>' : '')
      + '</div>';
  }
  function renderBattle(ix, iy, beg, st) {
    var a = st.a, b = st.b, over = st.over;
    var footer;
    if (over) {
      if (!st._applied) { st._applied = true; st._r = applyBattle(ix, iy, beg, st.winner === 'a' && !st.draw); }
      var r = st._r, won = st.winner === 'a' && !st.draw;
      var lvUp = won && r.levelsGained > 0;
      footer = '<div class="bresult ' + (won ? 'win' : st.draw ? 'draw' : 'lose') + '">'
        + (won ? 'Territory taken. +' + r.xp + ' XP' + (lvUp ? ' &middot; Level up to L' + r.newLevel : '')
          : st.draw ? 'Draw. They hold the cell.' : 'Defeated. +' + r.xp + ' XP') + '</div>'
        + (lvUp ? '<div class="grewnote">New growth &nbsp;L' + beg.attackerLevel + ' &rarr; L' + r.newLevel + '</div>' : '')
        + '<button id="mClose">' + (won ? 'Onward' : 'Back') + '</button>';
    } else {
      var fm = BAT.previewFoeMove(st), intent;
      if (fm.kind === 'attack') { var fdb = BAT.damageBand(b, a, fm), few = effWord(fdb.mult); intent = 'foe next: &#9876; ' + fm.name + ' <b>~' + Math.round((fdb.min + fdb.max) / 2) + '</b> <span class="g ' + few.c + '">' + few.g + '</span>'; }
      else intent = 'foe next: &#9881; ' + fm.name;
      footer = '<div class="bintent">' + intent + ' <span class="tglink" id="tgOpen">types?</span></div><div class="bmoves">' + a.moves.map(function (m, i) {
        var top = m.name + (m.stab && m.kind === 'attack' ? ' <span class="pip">&#10022;</span>' : ''), sub;
        if (m.kind === 'attack') {
          var db = BAT.damageBand(a, b, m), ew = effWord(db.mult), chip = (db.mult > 1 ? 2 : 0) + (m.stab ? 0 : 1);
          top += ew.g ? ' <span class="g ' + ew.c + '">' + ew.g + '</span>' : '';
          sub = '<span class="tbadge" style="background:' + (TYPE_COLOR[m.type] || '#8a9178') + '">' + m.type + '</span> '
            + db.min + '-' + db.max + ' &middot; ' + BAT.hitPercent(a, b, m) + '%'
            + (chip > 0 ? ' <span class="pchip">&#128737;-' + chip + '</span>' : '');
        } else sub = 'status';
        var yf = BAT.previewOrder(st, i) ? ' <span class="yf">&#9656;you first</span>' : '';
        return '<button class="bmove" data-i="' + i + '"><div class="bm-top">' + top + '</div><div class="bm-sub">' + sub + yf + '</div></button>';
      }).join('') + '</div><button class="bquick" id="bquick">quick resolve</button>';
    }
    document.getElementById('card').innerHTML =
      '<div class="bfight">' + bpanel(a, false) + '<div class="bvs">vs</div>' + bpanel(b, true) + '</div>'
      + '<div class="blog" id="blog">' + logLines(st._fulllog) + '</div>' + footer;
    if (over) {
      var c = document.getElementById('mClose'); if (c) c.addEventListener('click', hideModal);
      if (lvUp) {
        var aside = document.querySelector('#card .bside');
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var swap = function () {
          var old = aside && aside.querySelector('svg');
          if (!old) return;
          var holder = document.createElement('span');
          holder.innerHTML = E._generateBugSVG(a.cb, 74, r.newLevel);
          var neu = holder.firstChild;
          if (!reduce) neu.setAttribute('class', 'growpop');
          old.parentNode.replaceChild(neu, old);
        };
        if (reduce) swap(); else setTimeout(swap, 280);
      }
    }
    else {
      Array.prototype.forEach.call(document.querySelectorAll('.bmove'), function (el) {
        el.addEventListener('click', function () { advance(st, parseInt(el.getAttribute('data-i'), 10)); renderBattle(ix, iy, beg, st); });
      });
      document.getElementById('bquick').addEventListener('click', function () {
        while (!st.over) advance(st, bestMove(st.a, st.b));
        renderBattle(ix, iy, beg, st);
      });
      var tgo = document.getElementById('tgOpen'); if (tgo) tgo.addEventListener('click', openTypeGuide);
    }
    var lg = document.getElementById('blog'); if (lg) lg.scrollTop = lg.scrollHeight;
  }
  function openInfo(ix, iy, st) {
    var e = W.findBug(vault, st.cb);
    var s = E.bugStats(st.cb), nm = E.bugName(st.cb);
    var card = document.getElementById('card');
    card.innerHTML = '<h2>' + nm + '</h2>'
      + '<div class="fight"><div>' + E._generateBugSVG(st.cb, 84, st.level) + '</div></div>'
      + '<div class="sub">' + s.type + ' &middot; ' + s.cls + ' &middot; L' + st.level + ' &middot; holding this cell</div>'
      + '<div class="xp">' + (e ? e.wins + ' wins' + (e.level < W.LEVEL_CAP ? ' &middot; XP ' + e.xp + '/' + W.xpToNext(e.level) + ' to L' + (e.level + 1) : ' &middot; max level') : '') + '</div>'
      + matchLine(s.type)
      + '<button id="mClose">Close</button>'
      + '<button class="ghost" id="mRecall">Recall (free the cell)</button>';
    showModal();
    document.getElementById('mRecall').addEventListener('click', function () {
      delete vault.claims[W.key(ix, iy)]; save(vault); renderRoster(); renderMap(); hideModal();
      toast('Recalled. The cell is open again.');
    });
  }
  function showModal() {
    document.getElementById('modal').classList.add('show');
    var c = document.getElementById('mClose');
    if (c) c.addEventListener('click', hideModal);
  }
  function hideModal() { document.getElementById('modal').classList.remove('show'); }
  document.getElementById('modal').addEventListener('click', function (e) {
    if (e.target === this) hideModal();
  });

  function showAway(tick) {
    var lines = tick.raids.map(function (r) {
      return '<div class="' + (r.defended ? 'held' : 'lostc') + '">' + r.rival + ' raided '
        + r.ix + ',' + r.iy + ' (L' + r.level + ') · ' + (r.defended ? 'your bug held!' : 'cell lost') + '</div>';
    }).join('');
    document.getElementById('card').innerHTML = '<h2>While you were away</h2>'
      + '<div class="sub">' + tick.defended + ' held, ' + tick.lost + ' lost. Reclaim the red cells by beating their new defender.</div>'
      + '<div class="log">' + lines + '</div><button id="mClose">Got it</button>';
    showModal();
    document.getElementById('mClose').addEventListener('click', hideModal);
  }

  // first-run guide (shown once ever)
  var ONBOARD_KEY = 'litterbug_onboarded_v1';
  function onboard() {
    document.getElementById('card').innerHTML = '<h2>Welcome to Litter Bug</h2>'
      + '<div class="ob">'
      + '<p><b>Claim ground.</b> Tap an open cell to place one of your bugs and hold it.</p>'
      + '<p><b>Fight for it.</b> Tap a wild cell (colored border) to battle its defender. Win and the cell is yours, and your bug gains XP and grows new parts.</p>'
      + '<p><b>Grow the economy.</b> Held cells earn scrap over time. Spend scrap to breed two bugs into a new one.</p>'
      + '<p><b>Defend.</b> Rival factions raid your cells while you are away. Beat their new defender to reclaim the red cells.</p>'
      + '<p>Roll more bugs any time in the Mint Lab.</p>'
      + '</div><button id="obClose">Start playing</button>';
    showModal();
    document.getElementById('obClose').addEventListener('click', function () {
      try { localStorage.setItem(ONBOARD_KEY, '1'); } catch (e) {}
      hideModal();
    });
  }
  var firstRun = false;
  try { firstRun = !localStorage.getItem(ONBOARD_KEY); } catch (e) {}

  // rivals raid your cells while you are away; resolve on load
  var awayTick = W.worldTick(vault, now());
  if (awayTick.raids.length) save(vault);
  renderRoster(); renderMap();
  if (firstRun) onboard();
  else if (awayTick.raids.length) showAway(awayTick);
  setInterval(renderHUD, 15000);
})();
</script>
<div class="tgmodal" id="tgmodal"><div class="tgcard" id="tgcard"></div></div>
</body>
</html>
